name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Deterministic verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trusted benchmark source for offline validator tests
        run: |
          git fetch --depth=1 origin 7e0ca3e3738b31183b0661ed425f4d27b48d20bf
          git fetch --depth=1 origin 00fe129125fcf273f8c27332ec4b115b59779ce8
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check exact mixed history fixtures
        run: pnpm --filter @pi-agent-web/server exec tsx --test --test-name-pattern="mixed history" ../../tests/e2e/fixtures/production-harness.test.ts
      - run: pnpm test:smoke
      - run: pnpm test:pack

  browser:
    name: Packaged browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            test-results/browser-e2e
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  performance:
    permissions:
      contents: read
      actions: read
    name: Representative performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bench:representative
        env:
          PI_WEB_BENCHMARK_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Evaluate completion median budgets
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          description=tests/e2e/benchmarks/references.json
          git fetch --depth=1 origin "$REFERENCE_SHA"
          if [[ -n "$(git ls-tree "$REFERENCE_SHA" -- "$description")" ]]; then
            git show "$REFERENCE_SHA:$description" > "$RUNNER_TEMP/benchmark-references.json"
          else
            # First introduction only; future PRs use their base's registered references.
            cp "$description" "$RUNNER_TEMP/benchmark-references.json"
          fi
          source=$(node --input-type=module -e '
            import fs from "node:fs";
            import { referenceSet } from "./scripts/benchmark-reference-evidence.mjs";
            import { TRUSTED_REFERENCE_SOURCE } from "./scripts/benchmark-frozen-references.mjs";
            const set = referenceSet(JSON.parse(fs.readFileSync(process.argv[1])), "actions");
            if (set.status === "active") {
              if (set.source !== TRUSTED_REFERENCE_SOURCE) throw new Error("unsupported trusted reference source");
              process.stdout.write(TRUSTED_REFERENCE_SOURCE);
            }
          ' "$RUNNER_TEMP/benchmark-references.json")
          if [[ -n "$source" ]]; then git fetch --depth=1 origin "$source"; fi
          report=test-results/performance/representative/budget.md
          set +e
          node scripts/compare-benchmark-baseline.mjs "test-results/performance/representative/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --strict --references "$RUNNER_TEMP/benchmark-references.json" --environment actions > "$report" 2>&1
          status=$?
          set -e
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload representative benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-representative
          path: test-results/performance/representative
          if-no-files-found: error
          retention-days: 14
